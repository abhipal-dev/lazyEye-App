name: Mobile CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-mobile:
    name: Verify React Native Environment & Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Verify JavaScript Syntax & Core Components
        run: |
          node -e "console.log('Validating React Native Package Configuration...'); require('./package.json');"
          node scripts/patch-modules.js || true

      - name: Check React Native CLI Configuration
        run: npx @react-native-community/cli config || true
